<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Number Catch - Math Game</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eaf7ff;
}

#game {
  max-width: 700px;
  margin: auto;
  padding: 15px;
  text-align: center;
}

.header {
  background: white;
  border-radius: 24px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: 0 4px 12px rgba(0,0,0,.08);
}

.header h1 {
  margin: 0;
  font-size: 32px;
}

.header p {
  margin: 7px 0 0;
  color: #607d8b;
}

.stats {
  display: flex;
  gap: 10px;
  margin-bottom: 12px;
}

.stat {
  flex: 1;
  background: white;
  padding: 10px;
  border-radius: 15px;
  font-weight: bold;
}

#mission {
  background: white;
  border-radius: 20px;
  padding: 15px;
  margin-bottom: 12px;
  font-size: 23px;
  font-weight: bold;
}

#playArea {
  position: relative;
  height: 390px;
  background: #ffffff;
  border-radius: 28px;
  overflow: hidden;
  border: 5px solid #d7efff;
  box-shadow: 0 5px 15px rgba(0,0,0,.08);
}

.item {
  position: absolute;
  width: 65px;
  height: 65px;
  border: 0;
  border-radius: 50%;
  background: #fff3cd;
  font-size: 31px;
  cursor: pointer;
  box-shadow: 0 4px 8px rgba(0,0,0,.12);
  transition: transform .15s;
}

.item:active {
  transform: scale(.85);
}

#message {
  min-height: 65px;
  padding: 12px;
  font-size: 30px;
  font-weight: bold;
}

#next {
  display: none;
  border: 0;
  border-radius: 16px;
  padding: 14px 28px;
  background: #ff9800;
  color: white;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
}

@media (max-width: 500px) {
  #playArea {
    height: 350px;
  }

  .header h1 {
    font-size: 27px;
  }

  #mission {
    font-size: 19px;
  }

  .item {
    width: 58px;
    height: 58px;
    font-size: 27px;
  }
}
</style>
</head>

<body>

<div id="game">

  <div class="header">
    <h1>🎯 Number Catch!</h1>
    <p>Catch the numbers and become a Math Star!</p>
  </div>

  <div class="stats">
    <div class="stat">
      ⭐ Score<br>
      <span id="score">0</span>
    </div>

    <div class="stat">
      🏆 Level<br>
      <span id="level">1</span>
    </div>

    <div class="stat">
      🎯 Caught<br>
      <span id="caught">0</span>
    </div>
  </div>

  <div id="mission">
    Find number <span id="target">3</span>!
  </div>

  <div id="playArea"></div>

  <div id="message"></div>

  <button id="next">
    Next Round ➜
  </button>

</div>

<script>

const playArea = document.getElementById("playArea");
const targetBox = document.getElementById("target");
const message = document.getElementById("message");
const nextButton = document.getElementById("next");

const scoreBox = document.getElementById("score");
const levelBox = document.getElementById("level");
const caughtBox = document.getElementById("caught");

let score = 0;
let caught = 0;
let level = 1;
let target = 3;
let found = false;


/* Random number */
function randomNumber(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}


/* Create the game */
function startRound() {

  playArea.innerHTML = "";
  message.textContent = "";
  nextButton.style.display = "none";
  found = false;

  /*
    Difficulty increases every 3 successful rounds.
  */

  level = Math.floor(caught / 3) + 1;

  levelBox.textContent = level;

  const maxNumber =
    Math.min(5 + level * 2, 20);

  target = randomNumber(1, maxNumber);

  targetBox.textContent = target;


  /*
    More numbers appear at higher levels.
  */

  const itemCount =
    Math.min(7 + level, 15);


  /*
    Make sure the target exists.
  */

  createNumber(target);


  /*
    Create other random numbers.
  */

  for (let i = 1; i < itemCount; i++) {

    createNumber(
      randomNumber(1, maxNumber)
    );
  }
}


/* Create one clickable number */
function createNumber(number) {

  const button =
    document.createElement("button");

  button.className = "item";
  button.textContent = number;

  const maxX =
    Math.max(0, playArea.clientWidth - 70);

  const maxY =
    Math.max(0, playArea.clientHeight - 70);

  button.style.left =
    randomNumber(5, maxX) + "px";

  button.style.top =
    randomNumber(5, maxY) + "px";


  button.addEventListener("click", () => {

    if (found) return;

    if (number === target) {

      found = true;

      score += 10;
      caught++;

      scoreBox.textContent = score;
      caughtBox.textContent = caught;

      message.textContent =
        "🎉 GREAT WORK! ⭐";

      message.style.color = "#2e7d32";

      /*
        Highlight the correct number.
      */

      button.style.background = "#c8e6c9";
      button.style.transform = "scale(1.25)";

      document
        .querySelectorAll(".item")
        .forEach(item => {
          item.disabled = true;
        });

      nextButton.style.display =
        "inline-block";

    } else {

      score = Math.max(0, score - 1);

      scoreBox.textContent = score;

      message.textContent =
        "💪 Not this one! Try again.";

      message.style.color = "#e65100";

      button.disabled = true;
      button.style.opacity = "0.35";
    }
  });

  playArea.appendChild(button);
}


/* Next round */
nextButton.addEventListener("click", () => {
  startRound();
});


/* Start */
startRound();

</script>

</body>
</html>
