<div id="math-game">
  <style>
    #math-game {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 20px auto;
      padding: 20px;
      text-align: center;
      background: #f7fbff;
      border-radius: 28px;
    }

    #math-game h1 {
      margin: 5px 0;
      font-size: 34px;
    }

    #math-game .intro {
      color: #555;
      margin-bottom: 20px;
    }

    #math-game .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    #math-game button {
      border: 0;
      cursor: pointer;
      font-weight: bold;
      border-radius: 18px;
    }

    #math-game .choice {
      padding: 22px 10px;
      font-size: 22px;
      background: white;
      border: 3px solid #dcecff;
      box-shadow: 0 4px 10px rgba(0,0,0,.08);
    }

    #math-game .choice:hover {
      transform: translateY(-2px);
    }

    #math-game .game {
      display: none;
      background: white;
      padding: 22px;
      border-radius: 24px;
    }

    #math-game .top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    #math-game .question {
      font-size: 44px;
      font-weight: bold;
      margin: 25px 0;
    }

    #math-game .answer {
      width: 85%;
      max-width: 320px;
      padding: 15px;
      border: 4px solid #ffb300;
      background: #fff9d9;
      border-radius: 16px;
      text-align: center;
      font-size: 28px;
      outline: none;
    }

    #math-game .check {
      margin-top: 15px;
      padding: 15px 35px;
      font-size: 20px;
      background: #4caf50;
      color: white;
    }

    #math-game .message {
      min-height: 60px;
      margin-top: 18px;
      font-size: 30px;
      font-weight: bold;
    }

    #math-game .next,
    #math-game .back {
      padding: 12px 25px;
      font-size: 18px;
      margin: 5px;
    }

    #math-game .next {
      background: #ff9800;
      color: white;
    }

    #math-game .back {
      background: #e9eef5;
    }

    @media (max-width: 480px) {
      #math-game {
        padding: 14px;
      }

      #math-game .choices {
        grid-template-columns: 1fr;
      }

      #math-game .question {
        font-size: 36px;
      }
    }
  </style>

  <h1>🌟 Math Adventure</h1>
  <p class="intro">Choose a game and start learning!</p>

  <div class="choices">
    <button class="choice" data-op="+">➕<br>Addition</button>
    <button class="choice" data-op="-">➖<br>Subtraction</button>
    <button class="choice" data-op="*">✖️<br>Multiplication</button>
    <button class="choice" data-op="/">➗<br>Division</button>
  </div>

  <div class="game">
    <div class="top">
      <span>⭐ Score: <span class="score">0</span></span>
      <span>📚 Level: <span class="level">1</span></span>
    </div>

    <div class="question"></div>

    <input
      class="answer"
      type="number"
      inputmode="numeric"
      placeholder="Write answer"
      aria-label="Your answer"
    >

    <br>

    <button class="check">Check Answer ✓</button>

    <div class="message" aria-live="polite"></div>

    <button class="next" style="display:none;">
      Next Question ➜
    </button>

    <button class="back">
      ← Choose Another Game
    </button>
  </div>

  <script>
    (() => {
      const root = document.getElementById("math-game");

      const choices = root.querySelectorAll(".choice");
      const choicesBox = root.querySelector(".choices");
      const game = root.querySelector(".game");
      const question = root.querySelector(".question");
      const answer = root.querySelector(".answer");
      const check = root.querySelector(".check");
      const next = root.querySelector(".next");
      const back = root.querySelector(".back");
      const message = root.querySelector(".message");
      const scoreText = root.querySelector(".score");
      const levelText = root.querySelector(".level");

      let operation = "+";
      let correctAnswer = 0;
      let score = 0;
      let completed = 0;
      let answered = false;

      function randomNumber(max) {
        return Math.floor(Math.random() * max) + 1;
      }

      function makeQuestion() {
        answered = false;
        answer.value = "";
        message.textContent = "";
        next.style.display = "none";
        check.style.display = "inline-block";
        answer.disabled = false;

        const level = Math.floor(completed / 5) + 1;
        levelText.textContent = level;

        const max = Math.min(10 + (level - 1) * 5, 50);

        let a = randomNumber(max);
        let b = randomNumber(max);

        if (operation === "+") {
          correctAnswer = a + b;
          question.textContent = `${a} + ${b} = ?`;
        }

        if (operation === "-") {
          if (b > a) [a, b] = [b, a];
          correctAnswer = a - b;
          question.textContent = `${a} − ${b} = ?`;
        }

        if (operation === "*") {
          a = randomNumber(Math.min(10 + level, 20));
          b = randomNumber(Math.min(10 + level, 20));
          correctAnswer = a * b;
          question.textContent = `${a} × ${b} = ?`;
        }

        if (operation === "/") {
          b = randomNumber(Math.min(10 + level, 20));
          correctAnswer = randomNumber(Math.min(10 + level, 20));
          a = b * correctAnswer;
          question.textContent = `${a} ÷ ${b} = ?`;
        }

        answer.focus();
      }

      choices.forEach(button => {
        button.addEventListener("click", () => {
          operation = button.dataset.op;
          score = 0;
          completed = 0;
          scoreText.textContent = score;

          choicesBox.style.display = "none";
          game.style.display = "block";

          makeQuestion();
        });
      });

      check.addEventListener("click", () => {
        if (answered) return;

        if (answer.value.trim() === "") {
          message.textContent = "✏️ Write your answer!";
          message.style.color = "#e65100";
          answer.focus();
          return;
        }

        const userAnswer = Number(answer.value);

        if (userAnswer === correctAnswer) {
          answered = true;
          score++;
          completed++;

          scoreText.textContent = score;

          message.textContent = "🎉 GREAT WORK! 🎉";
          message.style.color = "#2e7d32";

          check.style.display = "none";
          next.style.display = "inline-block";
          answer.disabled = true;
        } else {
          message.textContent = "💪 Try Again!";
          message.style.color = "#d32f2f";
          answer.select();
        }
      });

      next.addEventListener("click", makeQuestion);

      answer.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          check.click();
        }
      });

      back.addEventListener("click", () => {
        game.style.display = "none";
        choicesBox.style.display = "grid";
        message.textContent = "";
      });
    })();
  </script>
</div>
